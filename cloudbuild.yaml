# Builds Tally and deploys it to Cloud Run. A Cloud Build trigger runs this on every push to the
# branch it watches (see README.md, Deploying with Cloud Build). The settings for your own
# project come from the trigger's substitutions, so nothing here names one:
#   _IMAGE           where to keep the image, e.g. us-central1-docker.pkg.dev/<project>/<repo>/tally
#   _REGION          the Cloud Run region, e.g. us-central1
#   _SQL_INSTANCE    the Cloud SQL instance, as <project>:<region>:<instance>
#   _DATASET         the BigQuery dataset for the export, as <project>.<dataset> (blank for none)
#   _RUN_AS          the service account Tally runs as, e.g. tally-run@<project>.iam.gserviceaccount.com
# The secrets tally-db-password and tally-jobs-secret must exist in the same project.
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '$_IMAGE:$COMMIT_SHA', '.']

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '$_IMAGE:$COMMIT_SHA']

  # Public: browsers on every site send hits here. One small instance handles hundreds of hits a
  # second; the second is for deploys and bursts.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - tally
      - --project=$PROJECT_ID
      - --region=$_REGION
      - --image=$_IMAGE:$COMMIT_SHA
      - --service-account=$_RUN_AS
      - --add-cloudsql-instances=$_SQL_INSTANCE
      - --set-env-vars=DB_SOCKET=/cloudsql/$_SQL_INSTANCE,DB_USER=tally,DB_NAME=tally,TALLY_DATASET=$_DATASET,GIT_COMMIT=$SHORT_SHA
      - --set-secrets=DB_PASSWORD=tally-db-password:latest,JOBS_SECRET=tally-jobs-secret:latest
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=2
      - --memory=256Mi
      - --timeout=600

options:
  # Needed when the build runs as its own service account.
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
